# swaylock
bindsym $mod+Shift+x exec $lockscreen

# bindsym $mod+a splitv
# bindsym $mod+Shift+a splith
# 
# bindsym $mod+Shift+q kill
# bindsym $mod+Shift+r reload

bindsym $mod+Shift+o layout toggle tabbed splitv splith

# move between fullscreened windows
# bindsym $mod+Shift+n fullscreen toggle; focus next; fullscreen toggle
# bindsym $mod+Shift+p fullscreen toggle; focus prev; fullscreen toggle

# toggle between workspaces
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output

bindsym mod1+Tab focus next
bindsym mod1+Shift+Tab focus prev

# Move the focused window with the same, but add Shift
bindsym $mod+Shift+$left workspace prev_on_output
bindsym $mod+Shift+$right workspace next_on_output
# Ditto, with arrow keys
bindsym $mod+Shift+Left workspace prev_on_output
bindsym $mod+Shift+Right workspace next_on_output

# Set up float
bindsym $mod+Shift+$down floating disable
bindsym $mod+Shift+$up floating enable; [floating con_id="__focused__"] resize set 70ppt 75ppt
bindsym $mod+Shift+Down floating disable
bindsym $mod+Shift+Up floating enable; [floating con_id="__focused__"] resize set 70ppt 75ppt
# bindgesture swipe:3:up floating enable; [floating con_id="__focused__"] resize set 70ppt 75ppt
# bindgesture swipe:3:down floating disable

# modes : for imitating keychords
mode "swap" {
  bindsym $mod+Shift+h mark --add "_swap", focus left,  swap container with mark "_swap", focus left , unmark "_swap" ; mode default
  bindsym $mod+Shift+j mark --add "_swap", focus down,  swap container with mark "_swap", focus down , unmark "_swap" ; mode default
  bindsym $mod+Shift+k mark --add "_swap", focus up,    swap container with mark "_swap", focus up   , unmark "_swap" ; mode default
  bindsym $mod+Shift+l mark --add "_swap", focus right, swap container with mark "_swap", focus right, unmark "_swap" ; mode default

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "launch" {
  bindsym $mod+Return exec $terminal ; mode "default"
  bindsym $mod+w exec $browser ; mode "default"
  bindsym $mod+i exec $incognito ; mode "default"
  bindsym $mod+n exec $filemanager ; mode "default"
  bindsym $mod+o exec $pdfreader ; mode "default"
  bindsym $mod+b exec $blueman ; mode "default"
  bindsym $mod+p exec $audio_settings ; mode "default"
  bindsym $mod+m exec $musicplayer ; mode "default"
  bindsym $mod+u exec $backgrounds ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "rofi" {
  bindsym $mod+d exec $rofi_drun ; mode "default"
  bindsym $mod+Shift+d exec $rofi_run ; mode "default"
  bindsym $mod+w exec $rofi_windows ; mode "default"
  bindsym $mod+e exec $rofi_emoji; mode "default"
  bindsym $mod+Shift+e exec $powermenu ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "bookmarks" {
  bindsym m exec $bookmarks ; mode "default"
  bindsym Shift+m exec $bookmarks_private ; mode "default"
  bindsym n exec $bookmarks_window ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "bookmarks_category" {
  bindsym m exec $bookmarks_category ; mode "default"
  bindsym Shift+m exec $bookmarks_category_private ; mode "default"
  bindsym n exec $bookmarks_category_window ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "notify" {
  bindsym m exec makoctl restore
  bindsym Shift+m exec makoctl dismiss --all ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

mode "script" {
  bindsym b exec $waybarThemeSwitcher ; mode "default"
  bindsym t exec $wlsunset ; mode "default"
  bindsym w exec $chooseBackground ; mode "default"
  bindsym x exec $executables ; mode "default"

  # escape mode keys
  bindsym Escape mode "default"
  bindsym Super_L mode "default"
  bindsym Return mode "default"
  bindsym Space mode "default"
}

